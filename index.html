<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Arush Karingala</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <!-- Liquid Glass Navigation -->
  <nav class="navbar">
    <div class="navbar-content">
      Arush Karingala
    </div>
  </nav>

  <div class="container">
    <!-- Hero Profile Section -->
    <header class="hero">
      <img src="photo.jpg" alt="Arush Karingala" class="profile-pic">
      <h1>Arush Karingala</h1>
      <p class="subtitle">Process Design Kit Engineer</p>
    </header>

    <h2 class="section-title">Experience & Certifications</h2>
    
    <!-- Continuous Curve Cards -->
    <main class="card-grid">
      
      <div class="card">
        <img src="cadence.png" alt="Cadence">
        <h3>Cadence</h3>
        <p>Design Systems</p>
      </div>

      <div class="card">
        <img src="intel.png" alt="Intel">
        <h3>Intel</h3>
        <p>Edge AI</p>
      </div>
      
      <div class="card">
        <img src="die.jpg" alt="Die">
        <h3>Semiconductor</h3>
        <p>Physical Design</p>
      </div>

      <div class="card">
        <img src="aws.png" alt="AWS">
        <h3>AWS Certified</h3>
        <p>Cloud Practitioner</p>
      </div>
      
      <div class="card">
        <img src="cisco.png" alt="Cisco">
        <h3>Cisco</h3>
        <p>Networking</p>
      </div>

      <div class="card">
        <img src="coursera.png" alt="Coursera">
        <h3>Coursera</h3>
        <p>Professional Certificate</p>
      </div>

    </main>
  </div>

  <footer class="footer">
    &copy; 2026 Arush Karingala.
  </footer>

</body>
</html>
